<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Dashboard')}">Dashboard</head>
<body th:attr="data-page='dashboard'">
    <th:block th:replace="~{fragments :: sidebar}"></th:block>
    <th:block th:replace="~{fragments :: topbar(user=${user}, role=${role})}"></th:block>
    <th:block th:replace="~{fragments :: scripts}"></th:block>
    <div class="main">
        <header class="topbar" style="height:auto;border-bottom:none;padding:1rem 1.5rem;">
            <div class="page-header">
                <h1 class="page-title">Dashboard</h1>
                <p class="page-subtitle">Overview of attendance statistics</p>
            </div>
        </header>
        <div class="page" id="dashboard-page">
            <div id="alert-dashboard"></div>
            <div class="dashboard-grid" id="stats"></div>
            <div class="card" style="margin-top:1rem;">
                <div style="font-weight:700;margin-bottom:0.75rem;">Recent Attendance Sessions</div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Date</th><th>Subject</th><th>Section</th><th>Status</th><th>Recorded By</th></tr></thead>
                        <tbody id="recent-sessions"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
