<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Settings')}">Settings</head>
<body th:attr="data-page='settings'" data-is-admin="true">
    <th:block th:replace="~{fragments :: sidebar}"></th:block>
    <th:block th:replace="~{fragments :: topbar(user=${user}, role=${role})}"></th:block>
    <th:block th:replace="~{fragments :: scripts}"></th:block>
    <div class="main">
        <header class="topbar" style="height:auto;border-bottom:none;padding:1rem 1.5rem;">
            <div class="page-header">
                <h1 class="page-title">Settings</h1>
                <p class="page-subtitle">Configure application settings (Admin only)</p>
            </div>
        </header>
        <div class="page" style="max-width:500px;">
            <div id="alert-settings"></div>
            <div class="card">
                <div style="font-weight:700;margin-bottom:1rem;">Attendance Threshold</div>
                <p style="margin-bottom:1rem;color:var(--text-muted);">Students with attendance below this percentage are flagged as defaulters.</p>
                <form id="threshold-form">
                    <div class="form-group">
                        <label>Minimum Attendance Threshold (%)</label>
                        <input id="threshold" type="number" min="0" max="100" value="75" required/>
                        <span id="current-threshold" style="font-size:0.9rem;color:var(--text-muted);"> (current: 75%)</span>
                    </div>
                    <div class="form-actions"><button class="btn btn-primary" type="submit">Update Threshold</button></div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
