<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Courses')}">Courses</head>
<body th:attr="data-page='courses'">
    <th:block th:replace="~{fragments :: sidebar}"></th:block>
    <th:block th:replace="~{fragments :: topbar(user=${user}, role=${role})}"></th:block>
    <th:block th:replace="~{fragments :: scripts}"></th:block>
    <div class="main">
        <header class="topbar" style="height:auto;border-bottom:none;padding:1rem 1.5rem;">
            <div class="page-header">
                <h1 class="page-title">Course Management</h1>
                <p class="page-subtitle">Manage courses offered by the institution</p>
            </div>
        </header>
        <div class="page">
            <div id="alert-courses"></div>
            <div class="toolbar">
                <button class="btn btn-primary" id="btn-add-course" data-admin-only="true">&#128224; Add Course</button>
                <span data-admin-only="true" style="font-size:0.85rem;color:var(--text-muted);">Admin only</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Code</th><th>Name</th><th>Department</th><th>Actions</th></tr></thead>
                    <tbody id="courses-list"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="course-modal">
        <div class="modal">
            <div class="modal-header"><div class="modal-title" id="course-modal-title">Add Course</div><button class="modal-close">&#215;</button></div>
            <div class="modal-body">
                <form id="course-form">
                    <div id="alert-course-modal" style="margin-bottom:1rem;"></div>
                    <div class="form-group"><label>Course Code</label><input id="c-code" type="text" required/><div class="error-msg"></div></div>
                    <div class="form-group"><label>Course Name</label><input id="c-name" type="text" required/><div class="error-msg"></div></div>
                    <div class="form-group"><label>Department</label><input id="c-department" type="text"/><div class="error-msg"></div></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="course-modal-cancel">Cancel</button>
                <button class="btn btn-danger" id="course-delete-btn" style="display:none;">Delete</button>
                <button class="btn btn-primary" type="submit" form="course-form">Save</button>
            </div>
        </div>
    </div>
</body>
</html>
