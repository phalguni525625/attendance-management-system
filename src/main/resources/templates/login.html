<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Login')}">Login</head>
<body th:attr="data-page='login'" data-is-admin="false">
    <th:block th:replace="~{fragments :: scripts}"></th:block>
    <main style="min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1rem;">
        <div class="card" style="width:100%;max-width:400px;padding:2rem;">
            <div style="text-align:center;margin-bottom:1.5rem;">
                <div style="font-size:1.5rem;font-weight:700;color:var(--text);">Attendance System</div>
                <div style="font-size:0.9rem;color:var(--text-muted);">Sign in to your account</div>
            </div>
            <div th:if="${param.error}" class="alert alert-error">Invalid username or password.</div>
            <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
            <div th:if="${param.session}" class="alert alert-info">Your session has expired. Please sign in again.</div>
            <form th:action="@{/api/auth/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus/>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required/>
                </div>
                <div class="form-actions" style="justify-content:flex-end;">
                    <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
                </div>
            </form>
            <div style="margin-top:1.25rem;font-size:0.9rem;color:var(--text-muted);border-top:1px solid var(--border);padding-top:0.75rem;">
                Demo: admin / admin123  |  faculty / faculty123
            </div>
        </div>
    </main>
</body>
</html>
