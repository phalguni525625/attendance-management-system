<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Profile')}">Profile</head>
<body th:attr="data-page='profile'">
    <th:block th:replace="~{fragments :: sidebar}"></th:block>
    <th:block th:replace="~{fragments :: topbar(user=${user}, role=${role})}"></th:block>
    <th:block th:replace="~{fragments :: scripts}"></th:block>
    <div class="main">
        <header class="topbar" style="height:auto;border-bottom:none;padding:1rem 1.5rem;">
            <div class="page-header">
                <h1 class="page-title">Profile</h1>
                <p class="page-subtitle">Change your password</p>
            </div>
        </header>
        <div class="page" style="max-width:500px;">
            <div id="alert-profile"></div>
            <div class="card">
                <div style="font-weight:700;margin-bottom:1rem;">Change Password</div>
                <form id="password-form">
                    <div class="form-group"><label>New Password</label><input id="p-new" type="password" required minlength="6"/><div class="error-msg"></div></div>
                    <div class="form-actions"><button class="btn btn-primary" type="submit">Change Password</button></div>
                </form>
                <p style="margin-top:1rem;font-size:0.9rem;color:var(--text-muted);">Passwords are hashed with BCrypt and never stored in plaintext.</p>
            </div>
        </div>
    </div>
</body>
</html>
