<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head(~{title})">Attendance</head>
<body th:attr="data-page='attendance'">
    <th:block th:replace="fragments :: sidebar"></th:block>
    <th:block th:replace="fragments :: topbar"></th:block>
    <th:block th:replace="fragments :: scripts"></th:block>
    <div class="main">
        <header class="topbar" style="height:auto;border-bottom:none;padding:1rem 1.5rem;">
            <div class="page-header">
                <h1 class="page-title">Attendance Management</h1>
                <p class="page-subtitle">Mark and edit attendance for classes</p>
            </div>
        </header>
        <div class="page">
            <div id="alert-attendance"></div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Course</label>
                    <select id="att-course" required></select>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <select id="att-subject" required></select>
                </div>
                <div class="form-group">
                    <label>Semester</label>
                    <select id="att-semester" required></select>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <select id="att-section" required></select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="att-date" required/>
                </div>
                <div class="form-group" style="align-self:end;">
                    <button class="btn btn-primary" id="btn-load-students">Load Students</button>
                </div>
            </div>

            <div id="att-session-info"></div>
            <input type="hidden" id="att-session-id"/>

            <div style="margin-top:1rem;">
                <strong>Students</strong> (click Present/Absent for each)
                <div class="attendance-grid" id="att-students"></div>
            </div>
            <div style="margin-top:1rem;display:flex;gap:0.75rem;">
                <button class="btn btn-primary" id="btn-save-attendance" disabled>Save Attendance</button>
                <span class="sr-only">Confirm before saving bulk attendance</span>
            </div>
        </div>
    </div>
</body>
</html>
