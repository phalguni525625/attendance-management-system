spring.application.name=attendance-management-system
server.port=8080

# ---------------------------------------------------------------------------
# Datasource (MySQL 8). Credentials must come from environment variables.
# Copy .env.example to .env (ignored by git) and set real values there.
# Never commit real passwords.
# ---------------------------------------------------------------------------
spring.datasource.url=${ATTENDANCE_DB_URL:jdbc:mysql://localhost:3306/attendance_db?useSSL=false\&allowPublicKeyRetrieval=true\&serverTimezone=UTC}
spring.datasource.username=${ATTENDANCE_DB_USER:attendance_app}
spring.datasource.password=${ATTENDANCE_DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.initialization-mode=never
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---------------------------------------------------------------------------
# Thymeleaf (server-rendered pages)
# ---------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ---------------------------------------------------------------------------
# SMTP (optional email notifications). All values via environment variables.
# ---------------------------------------------------------------------------
spring.mail.host=${ATTENDANCE_SMTP_HOST:}
spring.mail.port=${ATTENDANCE_SMTP_PORT:587}
spring.mail.username=${ATTENDANCE_SMTP_USER:}
spring.mail.password=${ATTENDANCE_SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${ATTENDANCE_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${ATTENDANCE_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ---------------------------------------------------------------------------
# Application settings
# ---------------------------------------------------------------------------
security.session.timeout-seconds=1800
attendance.threshold.default=75

# ---------------------------------------------------------------------------
# Logging (never log passwords or sensitive student data)
# ---------------------------------------------------------------------------
logging.level.com.attendance.system=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=WARN
logging.level.org.springframework.jdbc.core.StatementEncoder=OFF
