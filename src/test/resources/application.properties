# Test configuration — dedicated test database (never the user's real database)
spring.application.name=attendance-management-system-test
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/attendance_db_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=attendance_app
spring.datasource.password=${ATTENDANCE_DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.initialization-mode=none
spring.datasource.hikari.maximum-pool-size=5

spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false

spring.mail.host=

server.servlet.session.timeout=30m
attendance.threshold.default=75
attendance.demo.enabled=false

logging.level.com.attendance.system=DEBUG
